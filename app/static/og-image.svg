<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="200" cy="180" r="300" fill="#4f46e5" opacity="0.15" filter="blur(80px)"/>
  <circle cx="1000" cy="450" r="250" fill="#ec4899" opacity="0.12" filter="blur(80px)"/>

  <!-- Content Container -->
  <g transform="translate(100, 100)">
    <!-- Logo Pill -->
    <g transform="translate(0, 0)">
      <rect width="70" height="70" rx="20" fill="url(#brand)"/>
      <path d="M35 15L39 29L53 33L39 37L35 51L31 37L17 33L31 29L35 15Z" fill="#ffffff"/>
      <text x="88" y="47" font-family="Inter, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#f8fafc" letter-spacing="-1">
        Dreem<tspan fill="#818cf8">Folio</tspan>
      </text>
      <rect x="350" y="20" width="130" height="32" rx="16" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3"/>
      <text x="365" y="41" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#34d399" letter-spacing="1">
        ATS ENGINE
      </text>
    </g>

    <!-- Main Headline -->
    <text x="0" y="150" font-family="Inter, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
      The AI Career Operating System
    </text>

    <!-- Subtitle -->
    <text x="0" y="210" font-family="Inter, -apple-system, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">
      100% ATS-Friendly Resumes • Visual Photo CVs • AI Cover Letters • Live Portfolios
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 270)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="220" height="48" rx="14" fill="#0f172a" stroke="#334155"/>
      <text x="20" y="30" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">⚡ 100% ATS Scoring</text>

      <!-- Pill 2 -->
      <rect x="235" y="0" width="230" height="48" rx="14" fill="#0f172a" stroke="#334155"/>
      <text x="255" y="30" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">🎨 Visual Designer CVs</text>

      <!-- Pill 3 -->
      <rect x="480" y="0" width="230" height="48" rx="14" fill="#0f172a" stroke="#334155"/>
      <text x="500" y="30" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">🌐 Live Web Portfolios</text>

      <!-- Pill 4 -->
      <rect x="725" y="0" width="210" height="48" rx="14" fill="#0f172a" stroke="#334155"/>
      <text x="745" y="30" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#34d399">🔒 Zero AI Retention</text>
    </g>

    <!-- Trust Footer -->
    <g transform="translate(0, 365)">
      <text x="0" y="30" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#64748b">
        Loved by candidates worldwide • Free Forever Starter Tier • Pricing in USD &amp; LKR
      </text>
      <text x="800" y="30" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#818cf8">
        dreemfolio.com
      </text>
    </g>
  </g>
</svg>
