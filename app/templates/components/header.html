<!-- ═══════════════════════════════════════════════════════════════════════ -->
<!-- TOP NAVBAR / HEADER COMPONENT (Mobile & Tablet Responsive with Side Menu) -->
<!-- ═══════════════════════════════════════════════════════════════════════ -->
<header class="border-b border-slate-800/80 bg-slate-900/95 backdrop-blur sticky top-0 z-40">
  <div class="max-w-8xl mx-auto px-3 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-2 sm:gap-4">

    <!-- 1. BRAND LOGO & TITLE -->
    <a href="/" class="flex items-center space-x-2.5 sm:space-x-3 shrink-0 hover:opacity-90 transition group" title="Return to Home">
      <div
        class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-violet-600 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/20 text-white font-bold text-lg sm:text-xl shrink-0 group-hover:scale-105 transition">
        <i data-lucide="sparkles" class="w-4 h-4 sm:w-5 sm:h-5"></i>
      </div>
      <div class="flex flex-col">
        <div class="flex items-center space-x-1.5 sm:space-x-2">
          <span class="font-extrabold text-base sm:text-lg tracking-tight text-slate-100">ResuMatch<span
              class="text-indigo-400">.ai</span></span>
          <span
            class="hidden sm:inline-flex px-2 py-0.5 text-[10px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            ATS & Visual Designer
          </span>
        </div>
        <p class="text-[11px] text-slate-400 hidden lg:block tracking-normal">ATS Resumes • Visual Photo Formats • Live Portfolios</p>
      </div>
    </a>

    <!-- 2. DESKTOP HEADER ACTIONS (Visible on lg/xl screens) -->
    <div class="hidden lg:flex items-center space-x-3 xl:space-x-4">

      <!-- Return to Home Link -->
      <a href="/"
        class="px-2.5 py-1.5 rounded-lg border border-slate-700/60 bg-slate-800/40 hover:bg-slate-700/70 text-slate-300 hover:text-white transition text-xs font-semibold flex items-center gap-1.5"
        title="Return to Landing Page">
        <i data-lucide="home" class="w-3.5 h-3.5 text-indigo-400"></i>
        <span>Home</span>
      </a>
      
      <!-- Sample Loaders -->
      <div class="flex items-center space-x-1.5 text-xs bg-slate-800/60 p-1 rounded-lg border border-slate-700/60">
        <span class="text-slate-400 px-2 font-medium">Demo:</span>
        <button @click="loadSample('software_engineer')"
          class="px-2.5 py-1 rounded hover:bg-slate-700 text-slate-200 transition font-medium flex items-center gap-1">
          <i data-lucide="code-2" class="w-3.5 h-3.5 text-indigo-400"></i> Full Stack
        </button>
        <button @click="loadSample('product_manager')"
          class="px-2.5 py-1 rounded hover:bg-slate-700 text-slate-200 transition font-medium flex items-center gap-1">
          <i data-lucide="briefcase" class="w-3.5 h-3.5 text-violet-400"></i> Product Mgr
        </button>
      </div>

      <!-- Currency Selector Dropdown (Desktop) -->
      <div class="relative" x-data="{ openCurrency: false }" @click.outside="openCurrency = false">
        <button @click="openCurrency = !openCurrency"
          class="px-2 py-1.5 text-xs font-bold rounded-lg border border-slate-700/80 bg-slate-800/80 hover:bg-slate-700 text-slate-200 transition flex items-center gap-1 shadow-sm"
          title="Change billing currency">
          <span class="text-[11px] text-indigo-400 font-mono" x-text="activeCurrencySymbol || 'Rs.'"></span>
          <span x-text="activeCurrency || 'LKR'"></span>
          <i data-lucide="chevron-down" class="w-3 h-3 text-slate-400 transition-transform" :class="{'rotate-180': openCurrency}"></i>
        </button>
        <div x-show="openCurrency" x-cloak
          class="absolute right-0 mt-1 w-32 bg-slate-900 border border-slate-700 rounded-xl shadow-xl py-1 z-50 text-xs">
          <template x-for="c in availableCountries" :key="c.code">
            <button @click="selectCountryCurrency(c.code); openCurrency = false"
              class="w-full px-3 py-1.5 text-left hover:bg-slate-800 flex items-center justify-between text-slate-200 transition"
              :class="{'font-bold text-indigo-400 bg-slate-800/50': activeCountryCode === c.code}">
              <span x-text="c.name"></span>
              <span class="font-mono text-[10px] text-slate-400" x-text="c.currency"></span>
            </button>
          </template>
        </div>
      </div>

      <!-- Pricing Plans Trigger (Desktop) -->
      <button @click="showPricingModal = true"
        class="px-2.5 py-1.5 text-xs font-semibold rounded-lg border border-amber-500/30 bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 transition flex items-center gap-1.5 shadow-sm">
        <i data-lucide="crown" class="w-3.5 h-3.5 text-amber-400"></i>
        <span>Pricing Plans</span>
      </button>

      <!-- Dark / Light Mode Toggle -->
      <button @click="toggleDarkMode()" :title="darkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
        class="p-2 rounded-lg border border-slate-700 bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center gap-1.5 transition">
        <i x-show="darkMode" data-lucide="sun" class="w-4 h-4 text-amber-400"></i>
        <i x-show="!darkMode" data-lucide="moon" class="w-4 h-4 text-indigo-500"></i>
      </button>

      <!-- SaaS Auth & Real-Time MySQL Cloud Sync (Desktop) -->
      <template x-if="currentUser">
        <div class="flex items-center space-x-2">
          
          <!-- Real-Time MySQL Auto-Save Status Indicator -->
          <template x-if="tailoredData">
            <div class="flex items-center">
              <!-- If Free Plan: Cloud Save is disabled, prompt upgrade -->
              <template x-if="!currentUser.plan_tier || currentUser.plan_tier === 'free'">
                <button @click="showPricingModal = true"
                  class="px-2.5 py-1 text-xs bg-slate-800/80 hover:bg-slate-800 border border-slate-700 hover:border-amber-500/40 text-slate-400 hover:text-amber-300 rounded-lg flex items-center gap-1.5 transition shadow-sm"
                  title="MySQL Cloud Auto-Save is active. Restoring saved versions requires Pro!">
                  <i data-lucide="cloud" class="w-3.5 h-3.5 text-emerald-400"></i>
                  <span class="text-[11px] font-medium">Cloud Saved <span class="text-[9.5px] text-indigo-400 font-bold uppercase">(Auto)</span></span>
                </button>
              </template>

              <!-- If Pro / Elite Plan: Active Auto-Save Status -->
              <template x-if="currentUser.plan_tier && currentUser.plan_tier !== 'free'">
                <div class="flex items-center">
                  <!-- Status: Saving -->
                  <div x-show="autoSaveStatus === 'saving'"
                    class="px-2.5 py-1 text-xs bg-indigo-950/60 border border-indigo-500/30 text-indigo-300 rounded-lg flex items-center gap-1.5 shadow-sm animate-pulse">
                    <div class="w-3 h-3 border-2 border-indigo-400 border-t-transparent rounded-full animate-spin"></div>
                    <span class="font-medium text-[11px]">Saving to MySQL...</span>
                  </div>

                  <!-- Status: Saved -->
                  <div x-show="autoSaveStatus === 'saved'"
                    class="px-2.5 py-1 text-xs bg-emerald-950/50 border border-emerald-500/30 text-emerald-400 rounded-lg flex items-center gap-1.5 shadow-sm"
                    title="All edits, colors, fonts, section order and signatures are automatically saved to your MySQL database!">
                    <i data-lucide="cloud" class="w-3.5 h-3.5 text-emerald-400"></i>
                    <span class="font-bold text-[11px]">MySQL Auto-Saved</span>
                    <span class="text-[9.5px] text-emerald-300/80 font-mono hidden xl:inline" x-show="lastSavedTime" x-text="'at ' + lastSavedTime"></span>
                  </div>

                  <!-- Status: Unsaved / Waiting debounce -->
                  <div x-show="autoSaveStatus === 'unsaved'"
                    class="px-2.5 py-1 text-xs bg-amber-950/50 border border-amber-500/30 text-amber-300 rounded-lg flex items-center gap-1.5 shadow-sm">
                    <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-ping"></span>
                    <span class="font-medium text-[11px]">Auto-saving...</span>
                  </div>

                  <!-- Status: Error -->
                  <div x-show="autoSaveStatus === 'error'"
                    class="px-2.5 py-1 text-xs bg-red-950/50 border border-red-500/30 text-red-300 rounded-lg flex items-center gap-1.5 shadow-sm"
                    title="Auto-save encountered an error. Click to retry.">
                    <i data-lucide="alert-circle" class="w-3.5 h-3.5 text-red-400"></i>
                    <button @click="performAutoSave()" class="font-semibold text-[11px] underline">Retry Save</button>
                  </div>
                </div>
              </template>
            </div>
          </template>

          <!-- Admin Control Center (Super Admin Only) -->
          <template x-if="currentUser.is_admin">
            <div class="flex items-center space-x-1.5">
              <a href="/paneladmin"
                class="px-2.5 py-1.5 text-xs font-extrabold rounded-lg border border-purple-500/40 bg-purple-500/15 hover:bg-purple-500/25 text-purple-300 transition flex items-center gap-1.5 shadow-sm"
                title="Dedicated Enterprise Admin Portal">
                <i data-lucide="shield-check" class="w-3.5 h-3.5 text-purple-400"></i>
                <span>Admin Portal</span>
              </a>
              <button @click="openAdminModal()"
                class="p-1.5 text-xs rounded-lg border border-purple-500/30 bg-purple-500/10 hover:bg-purple-500/20 text-purple-300 transition flex items-center"
                title="Quick Admin Control Settings">
                <i data-lucide="sliders" class="w-3.5 h-3.5 text-purple-400"></i>
              </button>
            </div>
          </template>

          <!-- My Resumes (MySQL Cloud) Button -->
          <button @click="openSavedResumesModal()"
            class="px-3 py-1.5 text-xs font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 rounded-lg flex items-center gap-1.5 transition shadow-sm"
            title="View all resumes saved in your MySQL database">
            <i data-lucide="folder-open" class="w-3.5 h-3.5 text-indigo-400"></i>
            <span>My Resumes</span>
          </button>

          <!-- Interactive User Plan Badge & Strategic Lifetime Quota Popover -->
          <div class="relative" @click.outside="showQuotaDropdown = false">
            <div class="flex items-center space-x-1.5">
              <!-- Clickable Plan & Quota Pill -->
              <button @click="showQuotaDropdown = !showQuotaDropdown; $nextTick(() => { if (window.lucide) window.lucide.createIcons(); })"
                class="px-2.5 py-1 text-xs rounded-lg border flex items-center gap-1.5 transition shadow-sm cursor-pointer"
                :class="{
                  'bg-slate-800/90 text-slate-300 border-slate-700 hover:border-slate-600': !currentUser.plan_tier || currentUser.plan_tier === 'free',
                  'bg-indigo-500/15 text-indigo-300 border-indigo-500/30 hover:bg-indigo-500/25': currentUser.plan_tier === 'pro',
                  'bg-amber-500/15 text-amber-300 border-amber-500/30 hover:bg-amber-500/25': currentUser.plan_tier === 'elite'
                }"
                title="Click to view full lifetime quota & validity breakdown">
                
                <span class="font-extrabold uppercase text-[10px] tracking-wider"
                  x-text="(currentUser.plan_tier || 'free').toUpperCase() + ' PLAN'"></span>
                
                <!-- Quick Real-Time Quota Counter for Free Tier -->
                <template x-if="!currentUser.plan_tier || currentUser.plan_tier === 'free'">
                  <div class="flex items-center gap-1 text-[10px] font-mono ml-0.5 pl-1.5 border-l border-slate-700">
                    <span title="AI Tailoring Runs Left Today" class="text-indigo-300 font-semibold">AI:<span x-text="currentUser.daily_generations_remaining !== null ? currentUser.daily_generations_remaining : 2"></span></span>
                    <span class="text-slate-500">•</span>
                    <span title="Lifetime Classic ATS PDF Downloads Remaining" :class="(currentUser.lifetime_ats_downloads_remaining === 0) ? 'text-red-400 font-bold' : 'text-emerald-300 font-semibold'">ATS:<span x-text="currentUser.lifetime_ats_downloads_remaining !== null && currentUser.lifetime_ats_downloads_remaining !== undefined ? currentUser.lifetime_ats_downloads_remaining : 2"></span></span>
                    <span class="text-slate-500">•</span>
                    <span title="Lifetime Visual Photo CV Downloads Remaining" :class="(currentUser.lifetime_visual_downloads_remaining === 0) ? 'text-red-400 font-bold' : 'text-pink-300 font-semibold'">VCV:<span x-text="currentUser.lifetime_visual_downloads_remaining !== null && currentUser.lifetime_visual_downloads_remaining !== undefined ? currentUser.lifetime_visual_downloads_remaining : 1"></span></span>
                    <span class="text-slate-500">•</span>
                    <span title="Cover Letter Downloads Remaining" class="text-violet-300 font-semibold">CL:<span x-text="currentUser.lifetime_cover_letter_downloads_remaining !== null && currentUser.lifetime_cover_letter_downloads_remaining !== undefined ? currentUser.lifetime_cover_letter_downloads_remaining : 3"></span></span>
                  </div>
                </template>

                <i data-lucide="chevron-down" class="w-3 h-3 text-slate-400 transition-transform" :class="{'rotate-180': showQuotaDropdown}"></i>
              </button>

              <!-- Quick Upgrade CTA Button (Free Tier Only) -->
              <button x-show="!currentUser.plan_tier || currentUser.plan_tier === 'free'"
                @click="showPricingModal = true"
                class="px-2 py-1 text-[10.5px] font-bold bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 rounded-lg shadow flex items-center gap-1 transition">
                <i data-lucide="zap" class="w-3 h-3"></i> Upgrade
              </button>
            </div>

            <!-- Sleek Interactive Quota & Validity Popover -->
            <div x-show="showQuotaDropdown"
              x-cloak
              x-transition:enter="transition ease-out duration-150"
              x-transition:enter-start="opacity-0 translate-y-1 scale-95"
              x-transition:enter-end="opacity-100 translate-y-0 scale-100"
              x-transition:leave="transition ease-in duration-100"
              x-transition:leave-start="opacity-100 translate-y-0 scale-100"
              x-transition:leave-end="opacity-0 translate-y-1 scale-95"
              class="absolute right-0 mt-2 w-72 bg-slate-900 border border-slate-700/90 rounded-2xl shadow-2xl p-4 text-xs z-50 overflow-hidden">
              
              <!-- Popover Ambient Accent -->
              <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-indigo-500 via-violet-500 to-amber-500"></div>

              <!-- Header: Plan & Validity -->
              <div class="flex items-center justify-between pb-2.5 mb-2.5 border-b border-slate-800">
                <div>
                  <h4 class="font-extrabold text-slate-100 uppercase text-[11px] tracking-wider"
                    x-text="(currentUser.plan_tier || 'free').toUpperCase() + ' PLAN'"></h4>
                  <p class="text-[10px] text-slate-400 font-medium"
                    x-text="currentUser.subscription_validity_label || (currentUser.plan_tier === 'free' ? 'Lifetime Free Access' : 'Active Subscription')"></p>
                </div>
                <span class="px-2 py-0.5 text-[9.5px] font-bold rounded uppercase tracking-wider"
                  :class="{
                    'bg-slate-800 text-slate-400 border border-slate-700': !currentUser.plan_tier || currentUser.plan_tier === 'free',
                    'bg-indigo-500/20 text-indigo-300 border border-indigo-500/40': currentUser.plan_tier === 'pro',
                    'bg-amber-500/20 text-amber-300 border border-amber-500/40': currentUser.plan_tier === 'elite'
                  }"
                  x-text="currentUser.subscription_status || 'Active'"></span>
              </div>

              <!-- Quota Breakdown Items -->
              <div class="space-y-2 mb-3">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Account Quota Breakdown</p>

                <!-- AI Runs -->
                <div class="flex items-center justify-between p-1.5 rounded-lg bg-slate-800/60 border border-slate-700/50">
                  <div class="flex items-center gap-1.5 text-slate-300">
                    <i data-lucide="cpu" class="w-3.5 h-3.5 text-indigo-400"></i>
                    <span>AI Tailored Runs:</span>
                  </div>
                  <template x-if="!currentUser.plan_tier || currentUser.plan_tier === 'free'">
                    <span class="font-mono font-bold text-slate-200"
                      x-text="(currentUser.daily_generations_remaining !== null ? currentUser.daily_generations_remaining : 2) + ' left today'"></span>
                  </template>
                  <template x-if="currentUser.plan_tier && currentUser.plan_tier !== 'free'">
                    <span class="font-bold text-emerald-400 text-[10px] uppercase">Unlimited</span>
                  </template>
                </div>

                <!-- Classic ATS PDF -->
                <div class="flex items-center justify-between p-1.5 rounded-lg bg-slate-800/60 border border-slate-700/50">
                  <div class="flex items-center gap-1.5 text-slate-300">
                    <i data-lucide="file-text" class="w-3.5 h-3.5 text-emerald-400"></i>
                    <span>Classic ATS PDF:</span>
                  </div>
                  <template x-if="!currentUser.plan_tier || currentUser.plan_tier === 'free'">
                    <span class="font-mono font-bold"
                      :class="(currentUser.lifetime_ats_downloads_remaining === 0) ? 'text-red-400 font-black' : 'text-slate-200'"
                      x-text="(currentUser.lifetime_ats_downloads_remaining !== null && currentUser.lifetime_ats_downloads_remaining !== undefined ? currentUser.lifetime_ats_downloads_remaining : 2) + ' left (Lifetime)'"></span>
                  </template>
                  <template x-if="currentUser.plan_tier && currentUser.plan_tier !== 'free'">
                    <span class="font-bold text-emerald-400 text-[10px] uppercase">Unlimited</span>
                  </template>
                </div>

                <!-- Visual Photo CVs -->
                <div class="flex items-center justify-between p-1.5 rounded-lg bg-slate-800/60 border border-slate-700/50 text-[11px]">
                  <div class="flex items-center gap-1.5 text-slate-300">
                    <i data-lucide="palette" class="w-3.5 h-3.5 text-pink-400"></i>
                    <span>Visual Photo CV:</span>
                  </div>
                  <template x-if="!currentUser.plan_tier || currentUser.plan_tier === 'free'">
                    <span class="font-mono font-bold"
                      :class="(currentUser.lifetime_visual_downloads_remaining === 0) ? 'text-red-400 font-black' : 'text-slate-200'"
                      x-text="(currentUser.lifetime_visual_downloads_remaining !== null && currentUser.lifetime_visual_downloads_remaining !== undefined ? currentUser.lifetime_visual_downloads_remaining : 1) + ' left (Lifetime)'"></span>
                  </template>
                  <template x-if="currentUser.plan_tier && currentUser.plan_tier !== 'free'">
                    <span class="font-bold text-emerald-400 text-[10px] uppercase">Unlimited</span>
                  </template>
                </div>

                <!-- Cover Letters -->
                <div class="flex items-center justify-between p-1.5 rounded-lg bg-slate-800/60 border border-slate-700/50">
                  <div class="flex items-center gap-1.5 text-slate-300">
                    <i data-lucide="mail" class="w-3.5 h-3.5 text-violet-400"></i>
                    <span>AI Cover Letters:</span>
                  </div>
                  <template x-if="!currentUser.plan_tier || currentUser.plan_tier === 'free'">
                    <span class="font-mono font-bold"
                      :class="(currentUser.lifetime_cover_letter_downloads_remaining === 0) ? 'text-red-400 font-black' : 'text-slate-200'"
                      x-text="(currentUser.lifetime_cover_letter_downloads_remaining !== null && currentUser.lifetime_cover_letter_downloads_remaining !== undefined ? currentUser.lifetime_cover_letter_downloads_remaining : 3) + ' left (1st Clean)'"></span>
                  </template>
                  <template x-if="currentUser.plan_tier && currentUser.plan_tier !== 'free'">
                    <span class="font-bold text-emerald-400 text-[10px] uppercase">Unlimited Clean</span>
                  </template>
                </div>

                <!-- Visual Photo CVs -->
                <div class="flex items-center justify-between p-1.5 rounded-lg bg-slate-800/60 border border-slate-700/50 text-[11px]">
                  <div class="flex items-center gap-1.5 text-slate-300">
                    <i data-lucide="palette" class="w-3.5 h-3.5 text-pink-400"></i>
                    <span>Visual Photo CVs:</span>
                  </div>
                  <span class="text-[10px] font-semibold"
                    :class="(!currentUser.plan_tier || currentUser.plan_tier === 'free') ? 'text-amber-400' : 'text-emerald-400'"
                    x-text="(!currentUser.plan_tier || currentUser.plan_tier === 'free') ? 'Preview Only' : 'Unlocked'"></span>
                </div>

                <!-- Live Portfolio -->
                <div class="flex items-center justify-between p-1.5 rounded-lg bg-slate-800/60 border border-slate-700/50 text-[11px]">
                  <div class="flex items-center gap-1.5 text-slate-300">
                    <i data-lucide="globe" class="w-3.5 h-3.5 text-indigo-400"></i>
                    <span>Live Web Portfolio:</span>
                  </div>
                  <span class="text-[10px] font-semibold"
                    :class="(!currentUser.plan_tier || currentUser.plan_tier === 'free') ? 'text-amber-400' : 'text-emerald-400'"
                    x-text="(!currentUser.plan_tier || currentUser.plan_tier === 'free') ? 'Preview Only' : 'Hosted Active'"></span>
                </div>
              </div>

              <!-- CTA in Popover -->
              <template x-if="!currentUser.plan_tier || currentUser.plan_tier === 'free'">
                <button @click="showPricingModal = true; showQuotaDropdown = false;"
                  class="w-full py-2 px-3 rounded-xl font-bold text-xs bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 shadow transition flex items-center justify-center gap-1.5">
                  <i data-lucide="crown" class="w-3.5 h-3.5"></i>
                  <span>Upgrade to Pro Career ($9/mo)</span>
                </button>
              </template>
              <template x-if="currentUser.plan_tier && currentUser.plan_tier !== 'free'">
                <button @click="showPricingModal = true; showQuotaDropdown = false;"
                  class="w-full py-1.5 px-3 rounded-lg font-semibold text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition">
                  Manage Subscription Plans
                </button>
              </template>
            </div>
          </div>

          <!-- User Profile & Account Menu Dropdown -->
          <div class="relative" x-data="{ userMenuOpen: false }" @click.outside="userMenuOpen = false">
            <div class="flex items-center space-x-1.5 bg-slate-800/90 hover:bg-slate-800 border border-slate-700/90 rounded-xl px-2.5 py-1 text-xs shadow-sm transition">
              <!-- Profile Avatar & Name Trigger -->
              <button @click="userMenuOpen = !userMenuOpen; $nextTick(() => { if (window.lucide) window.lucide.createIcons(); })"
                class="flex items-center space-x-2 text-left focus:outline-none group">
                <!-- Avatar Circle with Bulletproof Error Fallback -->
                <div class="relative w-6 h-6 rounded-full shrink-0 flex items-center justify-center overflow-hidden ring-1.5 ring-indigo-500/50 shadow-sm bg-slate-900">
                  <img x-show="currentUser.avatar_url && !avatarImgFailed"
                    :src="currentUser.avatar_url"
                    referrerpolicy="no-referrer"
                    @error="avatarImgFailed = true"
                    @load="avatarImgFailed = false"
                    alt="User Avatar"
                    class="w-full h-full object-cover rounded-full" />
                  <div x-show="!currentUser.avatar_url || avatarImgFailed"
                    class="w-full h-full rounded-full bg-gradient-to-tr from-indigo-500 via-violet-600 to-pink-500 flex items-center justify-center font-bold text-[10.5px] text-white uppercase shadow-inner"
                    x-text="(currentUser.full_name || currentUser.email || 'U').trim().charAt(0).toUpperCase()">
                  </div>
                </div>

                <!-- User Full Name -->
                <span class="font-semibold text-slate-200 group-hover:text-white max-w-[105px] truncate tracking-tight transition"
                  x-text="currentUser.full_name || currentUser.email.split('@')[0]"></span>
                
                <i data-lucide="chevron-down" class="w-3 h-3 text-slate-400 group-hover:text-slate-300 transition-transform duration-150"
                  :class="{'rotate-180': userMenuOpen}"></i>
              </button>
