                                  class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold border border-slate-700 flex items-center gap-1.5 transition">
                                  <i data-lucide="bookmark-plus" class="w-3.5 h-3.5 text-purple-400"></i>
                                  <span>Save to Tracker</span>
                                </button>
                              </div>

                              <div class="flex items-center gap-2">
                                <a :href="item.easy_apply_url" target="_blank" rel="noopener noreferrer"
                                  class="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold flex items-center gap-1 shadow transition">
                                  <i data-lucide="zap" class="w-3 h-3 text-yellow-300"></i>
                                  <span>LinkedIn Easy Apply</span>
                                </a>
                                <a :href="item.apply_url" target="_blank" rel="noopener noreferrer"
                                  class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-xs font-medium flex items-center gap-1 transition">
                                  <i data-lucide="external-link" class="w-3 h-3"></i>
                                  <span>View</span>
                                </a>
                              </div>
                            </div>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </template>

              <!-- ═══════════════════════════════════════════════════════════════════ -->
              <!-- SUB-VIEW 3: APPLICATION TRACKER (KANBAN BOARD)                     -->
              <!-- ═══════════════════════════════════════════════════════════════════ -->
              <template x-if="jobSubTab === 'tracker'">
                <div class="space-y-4">
                  <div class="flex items-center justify-between">
                    <div>
                      <h4 class="text-sm font-bold text-white">My Job Applications Pipeline</h4>
                      <p class="text-xs text-slate-400">Track and advance your job submissions stored in MySQL</p>
                    </div>
                    <button @click="loadUserTrackedJobs()"
                      class="px-2.5 py-1 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700 flex items-center gap-1 transition">
                      <i data-lucide="refresh-cw" class="w-3 h-3"></i>
                      <span>Refresh</span>
                    </button>
                  </div>

                  <!-- Empty State -->
                  <template x-if="!isLoadingTrackedJobs && userTrackedJobs.length === 0">
                    <div class="p-10 text-center bg-slate-950 rounded-xl border border-dashed border-slate-800 space-y-2">
                      <i data-lucide="kanban" class="w-8 h-8 text-slate-600 mx-auto"></i>
                      <p class="text-xs font-semibold text-slate-300">No tracked job applications yet.</p>
                      <p class="text-[11px] text-slate-500">
                        Go to the <b>"AI Matches"</b> or <b>"Live Job Hunter"</b> tabs and click <b>"Save to Tracker"</b> or <b>"Mark as Applied"</b>!
                      </p>
                    </div>
                  </template>

                  <!-- Kanban Columns Grid -->
                  <template x-if="userTrackedJobs.length > 0">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                      
                      <!-- Column 1: Wishlist -->
                      <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 space-y-2.5 flex flex-col">
                        <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                          <span class="text-xs font-bold text-slate-300 flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-slate-400"></span>
                            <span>Wishlist</span>
                          </span>
                          <span class="text-[10px] px-1.5 py-0.2 bg-slate-800 text-slate-400 rounded-full font-bold"
                            x-text="userTrackedJobs.filter(j => j.status === 'wishlist').length"></span>
                        </div>
                        <div class="space-y-2 flex-1 overflow-y-auto max-h-[420px]">
                          <template x-for="j in userTrackedJobs.filter(j => j.status === 'wishlist')" :key="j.id">
                            <div class="p-2.5 rounded-lg bg-slate-900 border border-slate-800 space-y-2">
                              <div class="font-bold text-xs text-white" x-text="j.job_title"></div>
                              <div class="text-[11px] text-slate-400" x-text="j.company_name + ' • ' + j.location"></div>
                              <div class="flex items-center justify-between pt-1 border-t border-slate-800/60">
                                <button @click="updateTrackedJobStatus(j.id, 'applied')"
                                  class="text-[10px] px-2 py-0.5 bg-emerald-500/20 text-emerald-300 rounded hover:bg-emerald-500/30 transition">
                                  Mark Applied ➔
                                </button>
                                <button @click="deleteTrackedJob(j.id)" class="text-slate-500 hover:text-red-400 p-1">
                                  <i data-lucide="trash-2" class="w-3 h-3"></i>
                                </button>
                              </div>
                            </div>
                          </template>
                        </div>
                      </div>

                      <!-- Column 2: Applied -->
                      <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 space-y-2.5 flex flex-col">
                        <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                          <span class="text-xs font-bold text-blue-400 flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-blue-400"></span>
                            <span>Applied</span>
                          </span>
                          <span class="text-[10px] px-1.5 py-0.2 bg-blue-500/20 text-blue-300 rounded-full font-bold"
                            x-text="userTrackedJobs.filter(j => j.status === 'applied').length"></span>
                        </div>
                        <div class="space-y-2 flex-1 overflow-y-auto max-h-[420px]">
                          <template x-for="j in userTrackedJobs.filter(j => j.status === 'applied')" :key="j.id">
                            <div class="p-2.5 rounded-lg bg-slate-900 border border-slate-800 space-y-2">
                              <div class="font-bold text-xs text-white" x-text="j.job_title"></div>
                              <div class="text-[11px] text-slate-400" x-text="j.company_name"></div>
                              <div class="text-[10px] text-slate-500" x-text="'Applied: ' + (j.applied_date || j.created_at)"></div>
                              <div class="flex items-center justify-between pt-1 border-t border-slate-800/60">
                                <button @click="updateTrackedJobStatus(j.id, 'interviewing')"
                                  class="text-[10px] px-2 py-0.5 bg-purple-500/20 text-purple-300 rounded hover:bg-purple-500/30 transition">
                                  Interviewing ➔
                                </button>
                                <button @click="deleteTrackedJob(j.id)" class="text-slate-500 hover:text-red-400 p-1">
                                  <i data-lucide="trash-2" class="w-3 h-3"></i>
                                </button>
                              </div>
                            </div>
                          </template>
                        </div>
                      </div>

                      <!-- Column 3: Interviewing -->
                      <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 space-y-2.5 flex flex-col">
                        <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                          <span class="text-xs font-bold text-purple-400 flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-purple-400"></span>
                            <span>Interviewing</span>
                          </span>
                          <span class="text-[10px] px-1.5 py-0.2 bg-purple-500/20 text-purple-300 rounded-full font-bold"
                            x-text="userTrackedJobs.filter(j => j.status === 'interviewing').length"></span>
                        </div>
                        <div class="space-y-2 flex-1 overflow-y-auto max-h-[420px]">
                          <template x-for="j in userTrackedJobs.filter(j => j.status === 'interviewing')" :key="j.id">
                            <div class="p-2.5 rounded-lg bg-slate-900 border border-slate-800 space-y-2">
                              <div class="font-bold text-xs text-white" x-text="j.job_title"></div>
                              <div class="text-[11px] text-slate-400" x-text="j.company_name"></div>
                              <div class="flex items-center justify-between pt-1 border-t border-slate-800/60">
                                <button @click="updateTrackedJobStatus(j.id, 'offered')"
                                  class="text-[10px] px-2 py-0.5 bg-emerald-500/20 text-emerald-300 rounded hover:bg-emerald-500/30 transition">
                                  Offered 🎉
                                </button>
                                <button @click="deleteTrackedJob(j.id)" class="text-slate-500 hover:text-red-400 p-1">
                                  <i data-lucide="trash-2" class="w-3 h-3"></i>
                                </button>
                              </div>
                            </div>
                          </template>
                        </div>
                      </div>

                      <!-- Column 4: Offered -->
                      <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 space-y-2.5 flex flex-col">
                        <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                          <span class="text-xs font-bold text-emerald-400 flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                            <span>Offered 🎉</span>
                          </span>
                          <span class="text-[10px] px-1.5 py-0.2 bg-emerald-500/20 text-emerald-300 rounded-full font-bold"
                            x-text="userTrackedJobs.filter(j => j.status === 'offered').length"></span>
                        </div>
                        <div class="space-y-2 flex-1 overflow-y-auto max-h-[420px]">
                          <template x-for="j in userTrackedJobs.filter(j => j.status === 'offered')" :key="j.id">
                            <div class="p-2.5 rounded-lg bg-emerald-950/30 border border-emerald-500/30 space-y-2">
                              <div class="font-bold text-xs text-emerald-300" x-text="j.job_title"></div>
                              <div class="text-[11px] text-slate-300 font-semibold" x-text="j.company_name"></div>
                              <div class="flex items-center justify-between pt-1 border-t border-emerald-500/20">
                                <span class="text-[10px] text-emerald-400 font-bold">Offer Secured!</span>
                                <button @click="deleteTrackedJob(j.id)" class="text-slate-500 hover:text-red-400 p-1">
                                  <i data-lucide="trash-2" class="w-3 h-3"></i>
                                </button>
                              </div>
                            </div>
                          </template>
                        </div>
                      </div>

                    </div>
                  </template>
                </div>
              </template>

            </div>
          </template>
              </div>

              <!-- Fallback if empty -->
              <template x-if="!tailoredData || !tailoredData.matched_jobs || tailoredData.matched_jobs.length === 0">
                <div class="p-8 text-center bg-slate-900 rounded-xl border border-slate-800">
                  <i data-lucide="search" class="w-8 h-8 text-slate-500 mx-auto mb-2"></i>
                  <p class="text-sm text-slate-400">Tailoring matches for your profile...</p>
                </div>
              </template>

            </div>
          </template>

        </div>

      </div>

    </div>
