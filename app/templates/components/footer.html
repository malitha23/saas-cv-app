<!-- CLEAN RESUMATCH FOOTER COMPONENT -->
<!-- ═══════════════════════════════════════════════════════════════════════ -->
<footer class="border-t border-slate-800/80 bg-slate-950 text-slate-400 text-xs transition-colors mt-auto">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-12 pb-8">
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-8 lg:gap-12">
      
      <!-- Brand & Tagline -->
      <div class="md:col-span-2 space-y-3">
        <a href="/" class="inline-flex items-center space-x-2 group">
          <svg class="w-6 h-6 text-purple-500 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <span class="font-bold text-base sm:text-lg tracking-tight text-slate-100">
            ResuMatch<span class="text-purple-500">AI</span>
          </span>
        </a>
        <p class="text-xs text-slate-400 leading-relaxed max-w-sm">
          AI-powered resume customization to help you land your dream job. Tailor your application in seconds.
        </p>
      </div>

      <!-- Product -->
      <div class="space-y-3">
        <h4 class="text-xs font-semibold text-slate-200">Product</h4>
        <ul class="space-y-2.5 text-xs">
          <li>
            <a href="/#features" 
               @click="if (window.location.pathname === '/' || window.location.pathname === '') { const el = document.getElementById('features'); if (el) { $event.preventDefault(); el.scrollIntoView({behavior: 'smooth'}); } }"
               class="text-slate-400 hover:text-purple-400 transition-colors">
              Features
            </a>
          </li>
          <li>
            <a href="/#pricing" 
               @click="if (typeof showPricingModal !== 'undefined') { $event.preventDefault(); showPricingModal = true; } else if (window.location.pathname === '/' || window.location.pathname === '') { const el = document.getElementById('pricing'); if (el) { $event.preventDefault(); el.scrollIntoView({behavior: 'smooth'}); } }"
               class="text-slate-400 hover:text-purple-400 transition-colors">
              Pricing
            </a>
          </li>
          <li>
            <a href="/app" 
               class="text-slate-400 hover:text-purple-400 transition-colors">
              Template Gallery
            </a>
          </li>
        </ul>
      </div>

      <!-- Company -->
      <div class="space-y-3">
        <h4 class="text-xs font-semibold text-slate-200">Company</h4>
        <ul class="space-y-2.5 text-xs">
          <li>
            <a href="/#how-it-works" 
               @click="if (window.location.pathname === '/' || window.location.pathname === '') { const el = document.getElementById('how-it-works'); if (el) { $event.preventDefault(); el.scrollIntoView({behavior: 'smooth'}); } }"
               class="text-slate-400 hover:text-purple-400 transition-colors">
              About
            </a>
          </li>
          <li>
            <a href="/#faq" 
               @click="if (window.location.pathname === '/' || window.location.pathname === '') { const el = document.getElementById('faq'); if (el) { $event.preventDefault(); el.scrollIntoView({behavior: 'smooth'}); } }"
               class="text-slate-400 hover:text-purple-400 transition-colors">
              Help Center
            </a>
          </li>
          <li>
            <a href="/terms" 
               @click="if (typeof openLegalModal === 'function') { $event.preventDefault(); openLegalModal('terms'); }"
               class="text-slate-400 hover:text-purple-400 transition-colors">
              Terms & Conditions
            </a>
          </li>
          <li>
            <a href="/privacy" 
               @click="if (typeof openLegalModal === 'function') { $event.preventDefault(); openLegalModal('privacy'); }"
               class="text-slate-400 hover:text-purple-400 transition-colors">
              Privacy Policy
            </a>
          </li>
        </ul>
      </div>

    </div>

    <!-- Divider & Bottom Centered Copyright -->
    <div class="border-t border-slate-800/80 mt-10 pt-6 text-center">
      <p class="text-xs text-slate-500">
        &copy; 2026 ResuMatch AI. All rights reserved.
      </p>
    </div>

  </div>
</footer>
