<!-- ═══════════════════════════════════════════════════════════════════════ -->
<!-- IN-APP QUOTA LIMIT & PRO UPGRADE MODAL (Replaces generic browser alert)    -->
<!-- ═══════════════════════════════════════════════════════════════════════ -->
<div x-show="showQuotaLimitModal" x-cloak
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md transition-opacity"
  x-transition:enter="transition ease-out duration-200"
  x-transition:enter-start="opacity-0"
  x-transition:enter-end="opacity-100"
  x-transition:leave="transition ease-in duration-150"
  x-transition:leave-start="opacity-100"
  x-transition:leave-end="opacity-0"
  @keydown.escape.window="showQuotaLimitModal = false">

  <div class="bg-slate-900 border border-slate-700/80 rounded-2xl shadow-2xl max-w-md w-full p-6 text-slate-200 relative overflow-hidden"
    @click.outside="showQuotaLimitModal = false"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="scale-95 opacity-0"
    x-transition:enter-end="scale-100 opacity-100"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="scale-100 opacity-100"
    x-transition:leave-end="scale-95 opacity-0">

    <!-- Ambient Amber/Rose Glow -->
    <div class="absolute -top-20 -right-20 w-48 h-48 bg-amber-500/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-20 -left-20 w-48 h-48 bg-rose-500/15 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Close Cross Button -->
    <button @click="showQuotaLimitModal = false"
      class="absolute top-4 right-4 text-slate-400 hover:text-slate-100 p-1.5 rounded-lg hover:bg-slate-800 transition">
      <i data-lucide="x" class="w-5 h-5"></i>
    </button>

    <!-- Header Icon & Title -->
    <div class="flex flex-col items-center text-center mb-5">
      <div class="w-13 h-13 p-3 rounded-2xl bg-amber-500/15 border border-amber-500/30 text-amber-400 shadow-lg shadow-amber-500/10 mb-3.5">
        <i data-lucide="lock" class="w-6 h-6"></i>
      </div>
      <h3 class="text-lg sm:text-xl font-black text-white tracking-tight" x-text="quotaLimitData.title || 'Daily Free Limit Reached'"></h3>
      <p class="text-xs text-slate-300 mt-1.5 leading-relaxed" x-text="quotaLimitData.message || 'You have reached your daily free quota. Upgrade to Pro for unlimited access!'"></p>
    </div>

    <!-- Pro Career Perks Box -->
    <div class="bg-slate-800/80 border border-slate-700/80 rounded-xl p-4 mb-5 text-xs text-left">
      <div class="flex items-center justify-between mb-2.5 pb-2 border-b border-slate-700/60">
        <span class="font-bold text-slate-200 flex items-center gap-1.5">
          <i data-lucide="zap" class="w-3.5 h-3.5 text-amber-400"></i> Unlock with Pro Career ($9/mo)
        </span>
        <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30">
          🔥 Best Seller
        </span>
      </div>
      <ul class="space-y-1.5 text-slate-300 text-[11px]">
        <li class="flex items-center gap-2">
          <i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-emerald-400 shrink-0"></i>
          <span><b>Unlimited AI Tailoring runs</b> (No daily caps)</span>
        </li>
        <li class="flex items-center gap-2">
          <i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-emerald-400 shrink-0"></i>
          <span><b>Unlimited ATS & Visual Photo CV Downloads</b></span>
        </li>
        <li class="flex items-center gap-2">
          <i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-emerald-400 shrink-0"></i>
          <span><b>100% Watermark-Free & Clean Cover Letters</b></span>
        </li>
        <li class="flex items-center gap-2">
          <i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-emerald-400 shrink-0"></i>
          <span><b>Live Hosted Web Portfolio</b> (.resumatch.ai)</span>
        </li>
        <li class="flex items-center gap-2">
          <i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-emerald-400 shrink-0"></i>
          <span><b>MySQL Cloud Auto-Save & History Archive</b></span>
        </li>
      </ul>
    </div>

    <!-- Action Buttons -->
    <div class="flex flex-col gap-2.5">
      <button @click="showQuotaLimitModal = false; showPricingModal = true"
        class="w-full py-2.5 px-4 rounded-xl font-bold bg-gradient-to-r from-amber-500 via-amber-600 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-slate-950 shadow-lg shadow-amber-500/25 transition text-sm flex items-center justify-center gap-2">
        <i data-lucide="crown" class="w-4 h-4"></i>
        <span>Upgrade to Pro ($9/mo)</span>
      </button>

      <button @click="showQuotaLimitModal = false"
        class="w-full py-2 px-4 rounded-xl font-medium bg-slate-800 hover:bg-slate-700/80 text-slate-400 hover:text-slate-200 transition text-xs">
        Maybe Later
      </button>
    </div>

  </div>
</div>
