  <!-- SAAS AUTHENTICATION MODAL (REGISTER & LOGIN) -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <div x-show="showAuthModal" x-cloak
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4 relative">
      <button @click="showAuthModal = false" class="absolute top-4 right-4 text-slate-400 hover:text-white p-1 rounded-lg">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>

      <!-- Modal Header -->
      <div class="text-center space-y-1">
        <div class="w-10 h-10 mx-auto rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-600 flex items-center justify-center shadow-lg shadow-indigo-500/30 text-white mb-2">
          <i data-lucide="lock" class="w-5 h-5"></i>
        </div>
        <h3 class="text-lg font-bold text-slate-100" x-text="authMode === 'login' ? 'Welcome Back to DreemFolio' : 'Create Your SaaS Account'"></h3>
        <p class="text-xs text-slate-400" x-text="authMode === 'login' ? 'Sign in to access all templates, downloads & MySQL saved resumes' : 'Register in seconds to unlock unlimited tailoring & cloud persistence'"></p>
      </div>

      <!-- Mode Switcher Tabs -->
      <div class="grid grid-cols-2 p-1 bg-slate-950 rounded-xl border border-slate-800 text-xs">
        <button @click="authMode = 'login'; authError = ''; renderGoogleButton()"
          :class="{'bg-indigo-600 text-white font-bold shadow': authMode === 'login', 'text-slate-400 hover:text-slate-200': authMode !== 'login'}"
          class="py-1.5 rounded-lg transition text-center">
          Sign In
        </button>
        <button @click="authMode = 'register'; authError = ''; renderGoogleButton()"
          :class="{'bg-indigo-600 text-white font-bold shadow': authMode === 'register', 'text-slate-400 hover:text-slate-200': authMode !== 'register'}"
          class="py-1.5 rounded-lg transition text-center">
          Register
        </button>
      </div>

      <!-- Prompt Alert when triggered by action -->
      <template x-if="authPromptMessage">
        <div class="p-2.5 rounded-xl bg-indigo-500/15 border border-indigo-500/30 text-indigo-200 text-xs flex items-center gap-2">
          <i data-lucide="sparkles" class="w-4 h-4 text-indigo-400 shrink-0"></i>
          <span x-text="authPromptMessage"></span>
        </div>
      </template>

      <!-- Error Alert -->
      <template x-if="authError">
        <div class="p-2.5 rounded-lg bg-red-500/10 border border-red-500/30 text-red-300 text-xs flex items-center gap-2">
          <i data-lucide="alert-circle" class="w-4 h-4 text-red-400 shrink-0"></i>
          <span x-text="authError"></span>
        </div>
      </template>

      <!-- Google Sign-In / Registration Action with Native Popup -->
      <div class="pt-1">
        <!-- 1-Click Direct Google Popup Trigger Button -->
        <button type="button" @click="triggerGoogleSignIn()" :disabled="isSubmittingGoogleAuth"
          class="w-full py-2.5 px-4 bg-slate-950 hover:bg-slate-800/80 text-slate-200 border border-slate-700/80 hover:border-indigo-500/50 rounded-xl font-bold text-xs transition flex items-center justify-center gap-2.5 shadow-sm active:scale-[0.99] disabled:opacity-50">
          <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24Z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 10.03 0 12s.45 3.82 1.25 5.42l4.03-3.15Z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98Z"/>
          </svg>
          <template x-if="!isSubmittingGoogleAuth">
            <span x-text="authMode === 'login' ? 'Continue with Google' : 'Sign up with Google'"></span>
          </template>
          <template x-if="isSubmittingGoogleAuth">
            <span class="flex items-center gap-2 text-indigo-400">
              <span class="w-3.5 h-3.5 border-2 border-indigo-400 border-t-transparent rounded-full animate-spin"></span>
              <span>Opening Google Popup...</span>
            </span>
          </template>
        </button>
      </div>

      <!-- Divider: OR -->
      <div class="relative flex items-center py-1">
        <div class="flex-grow border-t border-slate-800"></div>
        <span class="flex-shrink mx-3 text-[10px] uppercase font-extrabold tracking-widest text-slate-500">or with email</span>
        <div class="flex-grow border-t border-slate-800"></div>
      </div>

      <!-- Auth Form -->
      <form @submit.prevent="submitAuth()" class="space-y-3 pt-1 text-xs">
        <div x-show="authMode === 'register'">
          <label class="block text-[10px] text-slate-400 uppercase font-semibold mb-1">Full Name</label>
          <input type="text" x-model="authForm.full_name" placeholder="Malitha Sayuranga"
            class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-slate-200 focus:border-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-[10px] text-slate-400 uppercase font-semibold mb-1">Email Address</label>
          <input type="email" required x-model="authForm.email" placeholder="you@example.com"
            class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-slate-200 focus:border-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-[10px] text-slate-400 uppercase font-semibold mb-1">Password</label>
          <input type="password" required minlength="6" x-model="authForm.password" placeholder="••••••••"
            class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-slate-200 focus:border-indigo-500 focus:outline-none">
          <span x-show="authMode === 'register'" class="text-[9px] text-slate-500 mt-0.5 block">Minimum 6 characters. Encrypted with bcrypt.</span>
        </div>

        <button type="submit" :disabled="isSubmittingAuth"
          class="w-full mt-2 py-2.5 px-4 bg-gradient-to-r from-indigo-500 to-violet-600 hover:from-indigo-600 hover:to-violet-700 disabled:opacity-50 text-white font-semibold rounded-xl shadow-lg shadow-indigo-500/25 flex items-center justify-center gap-2 transition">
          <template x-if="!isSubmittingAuth">
            <span x-text="authMode === 'login' ? 'Sign In' : 'Create Free Account'"></span>
          </template>
          <template x-if="isSubmittingAuth">
            <div class="flex items-center gap-2">
              <div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
              <span>Processing...</span>
            </div>
          </template>
        </button>
      </form>

      <!-- Toggle prompt -->
      <div class="text-center pt-2 border-t border-slate-800 text-xs text-slate-400">
        <template x-if="authMode === 'login'">
          <span>Don't have an account? <button @click="authMode = 'register'; authError = ''" class="text-indigo-400 hover:underline font-semibold">Register here</button></span>
        </template>
        <template x-if="authMode === 'register'">
          <span>Already have an account? <button @click="authMode = 'login'; authError = ''" class="text-indigo-400 hover:underline font-semibold">Sign In</button></span>
        </template>
      </div>

    </div>
  </div>
