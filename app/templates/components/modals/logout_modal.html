<!-- SLEEK IN-APP LOGOUT CONFIRMATION MODAL -->
<!-- ═══════════════════════════════════════════════════════════════════════ -->
<div x-show="showLogoutModal" x-cloak
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md transition-all duration-200">
  
  <div class="relative bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-5 overflow-hidden animate-in fade-in zoom-in-95">
    
    <!-- Background subtle glow -->
    <div class="absolute -top-20 -right-20 w-40 h-40 bg-red-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Header & Icon -->
    <div class="flex items-start space-x-3.5">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-red-500/20 to-amber-500/20 border border-red-500/30 flex items-center justify-center text-red-400 shadow-lg shadow-red-500/10 font-bold shrink-0">
        <i data-lucide="log-out" class="w-6 h-6"></i>
      </div>
      <div class="space-y-1">
        <h3 class="font-extrabold text-slate-100 text-lg">Log Out of ResuMatch.ai?</h3>
        <p class="text-xs text-slate-400">Are you sure you want to end your current authenticated session?</p>
      </div>
    </div>

    <!-- User Account Card -->
    <template x-if="currentUser">
      <div class="p-3.5 bg-slate-950/80 border border-slate-800 rounded-2xl flex items-center justify-between gap-3 text-xs">
        <div class="flex items-center gap-2.5 truncate">
          <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-500 to-pink-500 flex items-center justify-center font-bold text-white text-xs shrink-0 shadow"
            x-text="(currentUser.full_name || 'U').charAt(0).toUpperCase()"></div>
          <div class="truncate">
            <p class="font-bold text-slate-200 truncate" x-text="currentUser.full_name"></p>
            <p class="text-slate-400 text-[11px] font-mono truncate" x-text="currentUser.email"></p>
          </div>
        </div>
        <span class="px-2 py-0.5 rounded text-[9.5px] font-mono font-bold uppercase tracking-wider bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 shrink-0"
          x-text="(currentUser.plan_tier || 'free').toUpperCase()"></span>
      </div>
    </template>

    <!-- Reassurance Banner -->
    <div class="p-3 bg-slate-950/40 border border-slate-800/80 rounded-2xl flex items-center gap-2.5 text-xs text-slate-300">
      <i data-lucide="shield-check" class="w-4 h-4 text-emerald-400 shrink-0"></i>
      <span class="text-[11px] leading-relaxed">Your cloud resumes in MySQL and subscription days will remain securely preserved.</span>
    </div>

    <!-- Action Buttons -->
    <div class="grid grid-cols-2 gap-2.5 pt-1">
      <button @click="showLogoutModal = false"
        class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-xs rounded-xl border border-slate-700 transition text-center">
        Stay Logged In
      </button>

      <button @click="confirmLogout()"
        class="w-full py-2.5 bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white font-bold text-xs rounded-xl shadow-lg shadow-red-600/20 transition text-center flex items-center justify-center gap-1.5">
        <i data-lucide="log-out" class="w-4 h-4"></i>
        <span>Yes, Log Out</span>
      </button>
    </div>

  </div>
</div>
