  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <div x-show="showSavedResumesModal" x-cloak
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-xl w-full p-6 shadow-2xl space-y-4 max-h-[85vh] flex flex-col">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div class="flex items-center space-x-2">
          <div class="p-1.5 rounded-lg bg-indigo-500/10 text-indigo-400">
            <i data-lucide="database" class="w-5 h-5"></i>
          </div>
          <div>
            <h3 class="font-bold text-slate-100 text-base">My Saved Resumes</h3>
            <p class="text-xs text-slate-400">Stored safely in your MySQL database</p>
          </div>
        </div>
        <button @click="showSavedResumesModal = false" class="text-slate-400 hover:text-white p-1 rounded-lg">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Resumes List -->
      <div class="flex-1 overflow-y-auto space-y-2 pr-1 min-h-[220px]">
        <template x-if="isLoadingSavedResumes">
          <div class="flex flex-col items-center justify-center p-8 space-y-2 text-slate-400">
            <div class="w-6 h-6 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
            <span class="text-xs">Fetching your resumes from MySQL...</span>
          </div>
        </template>

        <template x-if="!isLoadingSavedResumes && userSavedResumes.length === 0">
          <div class="text-center p-8 space-y-2 text-slate-400 border border-dashed border-slate-800 rounded-xl">
            <i data-lucide="file-x" class="w-8 h-8 text-slate-600 mx-auto"></i>
            <p class="text-xs font-medium">No saved resumes found in your MySQL account yet.</p>
            <p class="text-[11px] text-slate-500">Tailor a resume and click <b>"Save to MySQL"</b> in the top header!</p>
          </div>
        </template>

        <template x-for="item in userSavedResumes" :key="item.id">
          <div class="p-3.5 rounded-xl bg-slate-950 border border-slate-800 hover:border-slate-700 flex items-center justify-between transition gap-3">
            <div class="space-y-1 flex-1 min-w-0">
              <div class="flex items-center gap-2">
                <span class="font-bold text-sm text-slate-200 truncate" x-text="item.title"></span>
                <span class="px-2 py-0.5 rounded text-[9px] font-mono uppercase bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 shrink-0"
                  x-text="item.template_style || 'ATS'"></span>
              </div>
              <div class="flex items-center gap-2 text-[11px] text-slate-400">
                <span x-text="item.target_role || 'General Role'"></span>
                <span>•</span>
                <span class="text-slate-500" x-text="item.updated_at"></span>
              </div>
            </div>

            <div class="flex items-center gap-1.5 shrink-0">
              <template x-if="!currentUser?.plan_tier || currentUser?.plan_tier === 'free'">
                <button @click="openProRestoreModal(item)"
                  class="px-2.5 py-1.5 bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 border border-amber-500/30 rounded-lg text-xs font-semibold flex items-center gap-1 transition shadow-sm">
                  <i data-lucide="lock" class="w-3.5 h-3.5 text-amber-400"></i>
                  <span>Restore (Pro Required)</span>
                </button>
              </template>
              <template x-if="currentUser?.plan_tier && currentUser?.plan_tier !== 'free'">
                <button @click="loadSavedResume(item.id)"
                  class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold flex items-center gap-1 transition shadow-sm">
                  <i data-lucide="upload" class="w-3.5 h-3.5"></i>
                  <span>Restore & Edit</span>
                </button>
              </template>
              <button @click="deleteSavedResume(item.id)"
                class="p-1.5 bg-slate-800 hover:bg-red-500/20 text-slate-400 hover:text-red-400 rounded-lg transition" title="Delete">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </div>
        </template>
      </div>

      <div class="flex justify-between items-center pt-3 border-t border-slate-800 text-xs">
        <span class="text-slate-500">MySQL Connection: <b class="text-emerald-400">Active</b></span>
        <button @click="showSavedResumesModal = false" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold rounded-lg">Close</button>
      </div>
    </div>
  </div>
