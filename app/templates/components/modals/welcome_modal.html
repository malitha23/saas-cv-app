<!-- ═══════════════════════════════════════════════════════════════════════ -->
<!-- IN-APP WELCOME & SUCCESS MODAL (Replaces generic browser alert)            -->
<!-- ═══════════════════════════════════════════════════════════════════════ -->
<div x-show="showWelcomeModal" x-cloak
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md transition-opacity"
  x-transition:enter="transition ease-out duration-200"
  x-transition:enter-start="opacity-0"
  x-transition:enter-end="opacity-100"
  x-transition:leave="transition ease-in duration-150"
  x-transition:leave-start="opacity-100"
  x-transition:leave-end="opacity-0"
  @keydown.escape.window="showWelcomeModal = false">

  <div class="bg-slate-900 border border-slate-700/80 rounded-2xl shadow-2xl max-w-lg w-full p-6 text-slate-200 relative overflow-hidden"
    @click.outside="showWelcomeModal = false"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="scale-95 opacity-0"
    x-transition:enter-end="scale-100 opacity-100"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="scale-100 opacity-100"
    x-transition:leave-end="scale-95 opacity-0">

    <!-- Ambient Glow Effect -->
    <div class="absolute -top-24 -right-24 w-56 h-56 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -left-24 w-56 h-56 bg-violet-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Close Cross Button -->
    <button @click="showWelcomeModal = false"
      class="absolute top-4 right-4 text-slate-400 hover:text-slate-100 p-1.5 rounded-lg hover:bg-slate-800 transition">
      <i data-lucide="x" class="w-5 h-5"></i>
    </button>

    <!-- Celebration Icon & Greeting -->
    <div class="flex flex-col items-center text-center mb-6">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-500 via-violet-600 to-pink-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30 mb-4 animate-bounce">
        <i data-lucide="sparkles" class="w-7 h-7"></i>
      </div>
      <h3 class="text-xl sm:text-2xl font-black text-white tracking-tight" x-text="welcomeModalData.title || '🎉 Welcome to ResuMatch AI!'"></h3>
      <p class="text-xs sm:text-sm text-slate-400 mt-1 max-w-sm" x-text="welcomeModalData.message || 'Your high-performance AI resume optimization account is active and ready.'"></p>
    </div>

    <!-- Candidate Account Card -->
    <div class="bg-slate-800/80 border border-slate-700/80 rounded-xl p-4 mb-5 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-indigo-600 to-pink-500 flex items-center justify-center font-bold text-white text-base shadow-sm shrink-0"
          x-text="(currentUser?.full_name || 'C').charAt(0).toUpperCase()"></div>
        <div class="text-left overflow-hidden">
          <h4 class="font-bold text-slate-100 text-sm truncate" x-text="currentUser?.full_name || 'Candidate'"></h4>
          <p class="text-xs text-slate-400 font-mono truncate" x-text="currentUser?.email || ''"></p>
        </div>
      </div>
      <div class="shrink-0">
        <span class="px-2.5 py-1 text-[11px] font-extrabold uppercase rounded-lg border tracking-wider"
          :class="{
            'bg-slate-700/80 text-slate-300 border-slate-600': !currentUser?.plan_tier || currentUser?.plan_tier === 'free',
            'bg-indigo-500/20 text-indigo-400 border-indigo-500/40': currentUser?.plan_tier === 'pro',
            'bg-amber-500/20 text-amber-300 border-amber-500/40': currentUser?.plan_tier === 'elite'
          }">
          <span x-text="(currentUser?.plan_tier || 'free').toUpperCase() + ' PLAN'"></span>
        </span>
      </div>
    </div>

    <!-- Quotas Available in This Account -->
    <div class="space-y-2 mb-6 text-xs text-left">
      <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider px-1">Your Starter Account Perks</p>
      
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
        <div class="p-2.5 rounded-xl bg-slate-800/50 border border-slate-700/60 flex items-center gap-2.5">
          <div class="p-1.5 rounded-lg bg-indigo-500/10 text-indigo-400 shrink-0">
            <i data-lucide="cpu" class="w-4 h-4"></i>
          </div>
          <div>
            <span class="font-bold text-slate-200">2 AI Tailored Runs</span>
            <p class="text-[10px] text-slate-400">Daily ATS Match & Optimization</p>
          </div>
        </div>

        <div class="p-2.5 rounded-xl bg-slate-800/50 border border-slate-700/60 flex items-center gap-2.5">
          <div class="p-1.5 rounded-lg bg-emerald-500/10 text-emerald-400 shrink-0">
            <i data-lucide="file-text" class="w-4 h-4"></i>
          </div>
          <div>
            <span class="font-bold text-slate-200">2 Classic ATS PDFs</span>
            <p class="text-[10px] text-slate-400">Lifetime Free Downloads</p>
          </div>
        </div>

        <div class="p-2.5 rounded-xl bg-slate-800/50 border border-slate-700/60 flex items-center gap-2.5">
          <div class="p-1.5 rounded-lg bg-pink-500/10 text-pink-400 shrink-0">
            <i data-lucide="palette" class="w-4 h-4"></i>
          </div>
          <div>
            <span class="font-bold text-slate-200">1 Visual Photo CV</span>
            <p class="text-[10px] text-slate-400">Lifetime Free High-Res Download</p>
          </div>
        </div>

        <div class="p-2.5 rounded-xl bg-slate-800/50 border border-slate-700/60 flex items-center gap-2.5">
          <div class="p-1.5 rounded-lg bg-violet-500/10 text-violet-400 shrink-0">
            <i data-lucide="mail" class="w-4 h-4"></i>
          </div>
          <div>
            <span class="font-bold text-slate-200">3 AI Cover Letters</span>
            <p class="text-[10px] text-slate-400">1st 100% Clean • 2 Watermarked</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex flex-col sm:flex-row items-center gap-3">
      <button @click="showWelcomeModal = false"
        class="w-full py-2.5 px-4 rounded-xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white shadow-lg shadow-indigo-500/25 transition text-sm flex items-center justify-center gap-2">
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
        <span>Start Building My Resume</span>
      </button>

      <button @click="showWelcomeModal = false; showPricingModal = true"
        class="w-full sm:w-auto py-2.5 px-4 rounded-xl font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 transition text-xs whitespace-nowrap">
        Explore Pro Perks
      </button>
    </div>

  </div>
</div>
