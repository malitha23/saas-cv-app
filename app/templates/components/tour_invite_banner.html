<!-- ═══════════════════════════════════════════════════════════════════════ -->
<!-- NEW USER QUICK TOUR INVITATION BANNER ("Puluwan nam withrak balanna")   -->
<!-- ═══════════════════════════════════════════════════════════════════════ -->
<template x-if="showTourBanner">
  <div class="col-span-1 lg:col-span-12 p-3 sm:p-4 bg-gradient-to-r from-indigo-950/90 via-slate-900 to-indigo-950/90 border border-indigo-500/40 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-3 text-xs shadow-xl shadow-indigo-950/40 relative overflow-hidden transition-all duration-300">
    <!-- Ambient subtle background glow -->
    <div class="absolute -right-10 -top-10 w-40 h-40 bg-indigo-500/15 rounded-full blur-2xl pointer-events-none"></div>

    <div class="flex items-center gap-3 relative z-10">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-pink-500 text-white flex items-center justify-center shrink-0 shadow-lg shadow-indigo-500/30">
        <i data-lucide="compass" class="w-5 h-5 animate-pulse"></i>
      </div>
      <div>
        <div class="flex items-center gap-2 flex-wrap">
          <span class="font-extrabold text-slate-100 text-xs sm:text-sm">👋 New to DreemFolio AI?</span>
          <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 font-mono">1-Min Tour</span>
          <span class="text-[10px] text-emerald-400 font-medium hidden md:inline">● Main Widgets Guide</span>
        </div>
        <p class="text-slate-300 text-[11px] sm:text-xs mt-0.5 leading-relaxed">
          Take a 60-second guided tour of the main tools: CV Auto-Parse, Job Tailor, Live ATS Score, 8 Templates, and Web Portfolio!
        </p>
      </div>
    </div>

    <div class="flex items-center gap-2 shrink-0 w-full sm:w-auto justify-end relative z-10">
      <button type="button" @click="dismissTourBanner(true)"
        class="px-3 py-1.5 text-slate-400 hover:text-slate-200 text-xs font-medium transition hover:bg-slate-800/60 rounded-xl">
        Skip / I know this
      </button>
      <button type="button" @click="startSpotlightTour()"
        class="px-4 py-2 bg-gradient-to-r from-indigo-600 to-pink-600 hover:from-indigo-500 hover:to-pink-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-indigo-600/30 transition flex items-center gap-1.5 active:scale-95">
        <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
        <span>Start Quick Tour ✨</span>
      </button>
    </div>
  </div>
</template>
