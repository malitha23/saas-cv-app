<!-- ═══════════════════════════════════════════════════════════════════════ -->
<!-- STEP 1: RESUME UPLOAD / PASTE COMPONENT -->
<!-- ═══════════════════════════════════════════════════════════════════════ -->
<div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-xl">
  <div class="flex items-center justify-between mb-3">
    <div class="flex items-center space-x-2">
      <div
        class="w-6 h-6 rounded-lg bg-indigo-500/10 text-indigo-400 flex items-center justify-center font-bold text-xs">
        1</div>
      <h2 class="font-semibold text-sm text-slate-200">Upload Your Resume (PDF/DOCX)</h2>
    </div>
    <span class="text-[11px] text-slate-400 font-mono"
      x-text="resumeText ? (resumeText.length + ' chars') : 'PDF / DOCX / TXT'"></span>
  </div>

  <!-- Drag & Drop Zone -->
  <div @dragover.prevent="dragOver = true" @dragleave.prevent="dragOver = false"
    @drop.prevent="handleFileDrop($event)"
    :class="{'border-indigo-500 bg-indigo-500/5': dragOver, 'border-slate-700 hover:border-slate-600 bg-slate-950/40': !dragOver}"
    class="border-2 border-dashed rounded-xl p-5 text-center transition cursor-pointer relative group">
    <input type="file" @change="handleFileUpload($event)" accept=".pdf,.docx,.doc,.txt"
      class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">

    <template x-if="!isUploading && !fileName">
      <div class="space-y-2">
        <div
          class="w-10 h-10 mx-auto rounded-full bg-slate-800 flex items-center justify-center text-slate-400 group-hover:text-indigo-400 group-hover:scale-110 transition">
          <i data-lucide="file-up" class="w-5 h-5"></i>
        </div>
        <p class="text-xs text-slate-300 font-medium">Click or drag & drop your actual resume</p>
        <p class="text-[10px] text-slate-500">Extracts real experience, education, projects, and skills</p>
      </div>
    </template>

    <template x-if="isUploading">
      <div class="space-y-2 py-2">
        <div class="w-6 h-6 mx-auto border-2 border-indigo-500 border-t-transparent rounded-full animate-spin">
        </div>
        <p class="text-xs text-indigo-300 font-medium">Extracting candidate data...</p>
      </div>
    </template>

    <template x-if="fileName && !isUploading">
      <div class="bg-slate-800/80 p-3 rounded-lg border border-slate-700 space-y-1.5 text-left">
        <div class="flex items-center justify-between truncate">
          <div class="flex items-center space-x-2 truncate">
            <i data-lucide="file-check" class="w-4 h-4 text-emerald-400 flex-shrink-0"></i>
            <span class="text-xs font-semibold text-slate-200 truncate" x-text="fileName"></span>
          </div>
          <button @click.stop="clearFile()" class="p-1 text-slate-400 hover:text-red-400 transition">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>

        <!-- Recognized Candidate Badge -->
        <template x-if="extractedCandidateName">
          <div
            class="text-[11px] bg-indigo-950/60 border border-indigo-500/30 rounded p-1.5 text-indigo-200 flex items-center gap-1.5">
            <i data-lucide="user-check" class="w-3.5 h-3.5 text-indigo-400"></i>
            <span>Candidate: <b class="text-white" x-text="extractedCandidateName"></b></span>
          </div>
        </template>
      </div>
    </template>
  </div>

  <!-- Optional: Paste / Edit Resume Text Toggle -->
  <div class="mt-3">
    <button @click="showRawText = !showRawText"
      class="text-[11px] text-indigo-400 hover:text-indigo-300 flex items-center gap-1">
      <span x-text="showRawText ? 'Hide extracted text' : 'View / edit extracted text manually'"></span>
      <i data-lucide="chevron-down" class="w-3 h-3 transition transform" :class="{'rotate-180': showRawText}"></i>
    </button>

    <div x-show="showRawText" x-cloak class="mt-2">
      <textarea x-model="resumeText" rows="6" placeholder="Paste your resume text here..."
        class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs text-slate-300 font-mono focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"></textarea>
    </div>
  </div>
</div>
