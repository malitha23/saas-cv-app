  <!-- 2. Portfolio Accent Color & Typography Palette -->

      <i data-lucide="palette" class="w-4 h-4 text-pink-400"></i>

    </span>

        <button @click="setPortfolioAccent('#06b6d4')"

        <button @click="setPortfolioAccent('#10b981')"
          class="w-7 h-7 rounded-lg bg-[#10b981] ring-2 transition transform active:scale-95"

        <button @click="setPortfolioAccent('#f43f5e')"
          class="w-7 h-7 rounded-lg bg-[#f43f5e] ring-2 transition transform active:scale-95"

        <button @click="setPortfolioAccent('#f59e0b')"

          :class="portfolioAccent === '#f59e0b' ? 'ring-white scale-110' : 'ring-transparent'"></button>
        <button @click="setPortfolioAccent('#8b5cf6')"
          class="w-7 h-7 rounded-lg bg-[#8b5cf6] ring-2 transition transform active:scale-95"

        <option value="JetBrains Mono">JetBrains Mono (Developer Monospace)</option>
        <option value="Outfit">Outfit (Geometric Aesthetic)</option>

        <span class="text-slate-300 font-medium">Direct Resume Download</span>

            <img :src="tailoredData.personal_info.avatar_url" class="w-12 h-12 rounded-xl object-cover ring-2 ring-pink-500/50">

          <template x-if="!tailoredData.personal_info.avatar_url">

          <div class="flex-1">

      <span class="text-xs font-bold text-slate-200 flex items-center gap-1.5">

          <div class="flex items-center justify-between gap-2">
            <input type="text" x-model="m.value" @input="refreshAllPreviews()"

            </div>
            <div>
              <label class="text-[10px] text-slate-500 uppercase font-semibold">Source Code Repo URL</label>
              <input type="text" x-model="p.link" @input="refreshAllPreviews()"
                placeholder="https://github.com/user/repo"
                class="w-full mt-0.5 bg-slate-950 border border-slate-800 rounded p-1.5 text-slate-300 font-mono text-[10px]">
            </div>
          </div>

          <!-- Bullets -->
          <div class="space-y-1.5 pt-1">
            <div class="flex items-center justify-between text-[10px] text-slate-400 font-semibold">
              <span>Impact & Architecture Bullets</span>
              <button @click="addProjectBullet(pIdx)" class="text-indigo-400 hover:underline flex items-center gap-0.5">
                <i data-lucide="plus" class="w-3 h-3"></i> Add Bullet
              </button>
            </div>
            <template x-for="(b, bIdx) in p.description_bullets" :key="bIdx">
              <div class="flex items-center gap-1.5">
                <input type="text" x-model="p.description_bullets[bIdx]" @input="refreshAllPreviews()"
                  class="flex-1 bg-slate-950 border border-slate-800 rounded px-2 py-1 text-slate-300 text-[11px]">
                <button @click="removeProjectBullet(pIdx, bIdx)" class="text-slate-600 hover:text-red-400 p-1">
                  <i data-lucide="x" class="w-3 h-3"></i>
                </button>
              </div>
            </template>
          </div>

        </div>
      </template>
    </div>
  </div>

  <!-- 7. ⚡ Technical Skills & Proficiency Sliders (Full CRUD) -->
  <div class="bg-slate-950/60 p-4 rounded-xl border border-slate-800 space-y-3 text-xs">
    <div class="flex items-center justify-between">
      <span class="text-xs font-bold text-slate-200 flex items-center gap-1.5">
        <i data-lucide="cpu" class="w-4 h-4 text-emerald-400"></i>
        <span>Technical Skills & Proficiency (CRUD)</span>
      </span>
      <button @click="addSkillCategory()"
        class="px-2.5 py-1 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/30 rounded-lg font-semibold text-[11px] transition flex items-center gap-1">
        <i data-lucide="plus" class="w-3 h-3"></i> Add Category
      </button>
    </div>

    <!-- Category list -->
    <div class="space-y-3">
      <template x-for="(cat, cIdx) in tailoredData.skill_categories" :key="cIdx">
        <div class="p-3 bg-slate-900/80 border border-slate-800 rounded-xl space-y-2.5">
          <div class="flex items-center justify-between gap-2">
            <input type="text" x-model="cat.category_name" @input="refreshAllPreviews()"
              class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1 text-emerald-300 font-bold text-xs">
            <button @click="addPortfolioSkill(cIdx)"
              class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-[10px] font-semibold flex items-center gap-1">
              <i data-lucide="plus" class="w-3 h-3"></i> Add Skill
            </button>
            <button @click="removeSkillCategory(cIdx)" class="text-slate-500 hover:text-red-400 p-1">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            </button>
          </div>

          <!-- Skills list with proficiency sliders -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">
            <template x-for="(s, sIdx) in cat.skills" :key="sIdx">
              <div class="p-2 bg-slate-950 border border-slate-800/80 rounded-lg space-y-1">
                <div class="flex items-center justify-between">
                  <input type="text" x-model="cat.skills[sIdx]" @input="refreshAllPreviews()"
                    class="bg-transparent border-none text-slate-200 font-medium text-xs focus:outline-none flex-1">
                  <span class="text-[10px] font-mono text-emerald-400 font-bold"
                    x-text="(cat.skill_levels ? cat.skill_levels[s] || 85 : 85) + '%'"></span>
                  <button @click="removePortfolioSkill(cIdx, sIdx)" class="text-slate-600 hover:text-red-400 ml-1">
                    <i data-lucide="x" class="w-3 h-3"></i>
                  </button>
                </div>
                <input type="range" min="10" max="100" step="5"
                  :value="cat.skill_levels ? cat.skill_levels[s] || 85 : 85"
                  @input="updateSkillLevel(cIdx, s, $event.target.value)"
                  class="w-full h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-emerald-400">
              </div>
            </template>
          </div>

        </div>
      </template>
    </div>
  </div>

  <!-- 8. 💼 Career Milestones & Experience (Full CRUD) -->
  <div class="bg-slate-950/60 p-4 rounded-xl border border-slate-800 space-y-3 text-xs">
    <div class="flex items-center justify-between">
      <span class="text-xs font-bold text-slate-200 flex items-center gap-1.5">
        <i data-lucide="briefcase" class="w-4 h-4 text-amber-400"></i>
        <span>Career Milestones & Experience (CRUD)</span>
      </span>
      <button @click="addPortfolioExperience()"
        class="px-2.5 py-1 bg-amber-600/20 hover:bg-amber-600/30 text-amber-300 border border-amber-500/30 rounded-lg font-semibold text-[11px] transition flex items-center gap-1">
        <i data-lucide="plus" class="w-3 h-3"></i> Add Milestone
      </button>
    </div>

    <!-- Experience items -->
    <div class="space-y-3">
      <template x-for="(exp, eIdx) in tailoredData.work_experience" :key="eIdx">
        <div class="p-3 bg-slate-900/80 border border-slate-800 rounded-xl space-y-2">
          <div class="flex items-center justify-between gap-2">
            <input type="text" x-model="exp.job_title" @input="refreshAllPreviews()"
              placeholder="Job Title"
              class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1 text-slate-100 font-bold text-xs">
            <button @click="removePortfolioExperience(eIdx)" class="text-slate-500 hover:text-red-400 p-1">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
            <div>
              <label class="text-[9px] text-slate-500 uppercase font-semibold">Company</label>
              <input type="text" x-model="exp.company" @input="refreshAllPreviews()"
                class="w-full mt-0.5 bg-slate-950 border border-slate-800 rounded p-1.5 text-slate-300 text-[11px]">
            </div>
            <div>
              <label class="text-[9px] text-slate-500 uppercase font-semibold">Start Date</label>
              <input type="text" x-model="exp.start_date" @input="refreshAllPreviews()"
                class="w-full mt-0.5 bg-slate-950 border border-slate-800 rounded p-1.5 text-slate-300 text-[11px]">
            </div>
            <div>
              <label class="text-[9px] text-slate-500 uppercase font-semibold">End Date</label>
              <input type="text" x-model="exp.end_date" @input="refreshAllPreviews()"
                class="w-full mt-0.5 bg-slate-950 border border-slate-800 rounded p-1.5 text-slate-300 text-[11px]">
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- 9. Custom Domain Connector Box -->
  <div class="bg-gradient-to-r from-pink-950/40 to-indigo-950/40 border border-pink-500/30 rounded-xl p-3.5 space-y-2">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-1.5">
        <i data-lucide="globe" class="w-4 h-4 text-pink-400"></i>
        <span class="text-xs font-bold text-slate-200">Private Custom Domain</span>
      </div>
      <button @click="showDomainModal = true"
        class="text-[10px] text-pink-400 hover:underline font-semibold flex items-center gap-0.5">
        DNS Guide <i data-lucide="chevron-right" class="w-3 h-3"></i>
      </button>
    </div>
    <div class="flex gap-2">
      <input type="text" x-model="tailoredData.personal_info.custom_domain" @input="refreshAllPreviews()"
        placeholder="e.g. malitha.dev"
        class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-mono text-slate-200 focus:border-pink-500 focus:outline-none">
      <button @click="verifyAndConnectDomain()"
        class="px-3 py-1.5 bg-pink-600 hover:bg-pink-500 text-white font-semibold text-xs rounded-lg shadow transition">
        Connect
      </button>
    </div>
  </div>

  <!-- 10. Social Media & Custom Links Manager (CRUD) -->
  <div class="bg-slate-950/60 p-3.5 rounded-xl border border-slate-800 space-y-2.5">
    <div class="flex items-center justify-between">
      <label class="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
        <i data-lucide="share-2" class="w-3.5 h-3.5 text-indigo-400"></i>
        <span>Social Media & Contact Endpoints</span>
      </label>
      <button @click="addSocialLink()"
        class="text-[10px] bg-indigo-600/30 text-indigo-300 hover:bg-indigo-600/50 px-2 py-0.5 rounded transition flex items-center gap-1">
        <i data-lucide="plus" class="w-3 h-3"></i> Add Link
      </button>
    </div>

    <!-- List of Editable Social Links -->
    <template x-for="(link, lIdx) in tailoredData.personal_info.social_links" :key="lIdx">
      <div class="bg-slate-900 p-2 rounded-lg border border-slate-800 flex items-center gap-2 text-xs">
        <input type="text" x-model="link.name" @input="refreshAllPreviews()"
          class="w-24 bg-slate-950 border border-slate-800 rounded p-1 text-slate-200 font-semibold text-[11px]"
          placeholder="Platform">
        <input type="text" x-model="link.url" @input="refreshAllPreviews()"
          class="flex-1 bg-slate-950 border border-slate-800 rounded p-1 text-slate-300 text-[11px]"
          placeholder="URL / handle">
        <button @click="link.enabled = !link.enabled; refreshAllPreviews()"
          :class="link.enabled ? 'text-emerald-400 bg-emerald-500/10' : 'text-slate-500 bg-slate-800'"
          class="p-1 rounded text-[10px] font-bold px-1.5">
          <span x-text="link.enabled ? 'ON' : 'OFF'"></span>
        </button>
        <button @click="removeSocialLink(lIdx)" class="text-slate-500 hover:text-red-400 p-1">
          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </template>
  </div>

</div>
